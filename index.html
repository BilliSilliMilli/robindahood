<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RobinDahood Secure Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08101d,#0d1427);color:#eef3ff;font:14px system-ui,Segoe UI,Arial;min-height:100vh}.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(430px,100%);background:#121a2f;border:1px solid #263353;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0007}.card h1{margin:0 0 8px}.muted{color:#98a6c7}label{display:block;margin-top:12px}input{display:block;width:100%;margin-top:6px;padding:11px;border-radius:9px;border:1px solid #263353;background:#0d1529;color:#eef3ff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{padding:10px 13px;border-radius:9px;border:1px solid #263353;background:#17223b;color:#eef3ff;cursor:pointer}.primary{background:#6ea8fe;color:#07101f;font-weight:700}.error{min-height:21px;color:#ff6b7a;margin-top:10px}.topbar{display:none;height:54px;padding:9px 14px;background:#0b1224;border-bottom:1px solid #263353;align-items:center;justify-content:space-between;gap:10px}.frame{display:none;width:100%;height:calc(100vh - 54px);border:0;background:#0b1020}.email{color:#98a6c7;font-size:12px}</style></head><body><div id="gate" class="gate"><div class="card"><h1>Trading Dashboard Login</h1><div class="muted">Sign in with your authorized Firebase account.</div><label>Email<input id="email" type="email" autocomplete="username" placeholder="bilalsmirza123@gmail.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password"></label><div class="row"><button id="login" class="primary">Sign In</button><button id="reset">Reset Password</button></div><div id="error" class="error"></div></div></div><div id="topbar" class="topbar"><div><b>RobinDahood Dashboard</b> <span id="user" class="email"></span></div><button id="logout">Sign Out</button></div><iframe id="dashboard" class="frame" title="Trading Dashboard"></iframe><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{firebaseConfig,allowedEmails}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),gate=document.getElementById('gate'),topbar=document.getElementById('topbar'),frame=document.getElementById('dashboard'),error=document.getElementById('error'),email=document.getElementById('email'),password=document.getElementById('password'),user=document.getElementById('user');const ok=e=>!allowedEmails.length||allowedEmails.map(x=>x.toLowerCase()).includes((e||'').toLowerCase());async function loadDashboard(){if(frame.src)return;const url='https://raw.githubusercontent.com/BilliSilliMilli/robindahood/4a88928841f4c3dc8908387a881504169fef5e01/index.html';const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Dashboard file could not be loaded.');const html=await r.text();frame.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));}document.getElementById('login').onclick=async()=>{error.textContent='';try{const r=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);if(!ok(r.user.email)){await signOut(auth);throw new Error('This account is not authorized.')}}catch(e){error.textContent=e.message.replace('Firebase: ','')}};document.getElementById('reset').onclick=async()=>{if(!email.value.trim())return error.textContent='Enter your email first.';try{await sendPasswordResetEmail(auth,email.value.trim());error.textContent='Password reset email sent.'}catch(e){error.textContent=e.message.replace('Firebase: ','')}};document.getElementById('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{if(u&&ok(u.email)){gate.style.display='none';topbar.style.display='flex';frame.style.display='block';user.textContent=u.email;try{await loadDashboard()}catch(e){error.textContent=e.message}}else{if(u)await signOut(auth);gate.style.display='flex';topbar.style.display='none';frame.style.display='none';user.textContent=''}});</script></body></html>
